[package]
name = "texdraft"
version = "0.1.0"
description = "A focused desktop scratchpad for LaTeX mathematics"
authors = ["TeXDraft contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "texdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tectonic = "0.17"
tempfile = "3"
